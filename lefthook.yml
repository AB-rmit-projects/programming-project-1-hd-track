pre-commit:
  commands:
    validate-placeholders:
      run: node scripts/validate-placeholders.js

    check-whitespace:
      run: git diff --cached --check

    lint-frontend:
      root: 'frontend/'
      glob: 'src/**/*.{ts,tsx}'
      run: npx eslint --fix {staged_files}

    lint-backend:
      root: 'backend/'
      glob: 'src/**/*.ts'
      run: npx eslint --fix {staged_files}

commit-msg:
  commands:
    conventional-commit:
      run: node scripts/check-commit-msg.js {1}
