packages:
  - 'frontend'
  - 'backend'

overrides:
  # firebase-functions pulls in @types/express@4 transitively, which conflicts
  # with our own @types/express@^5 (backend uses Express 5) and causes
  # environment-dependent type errors depending on how pnpm hoists the two
  # versions. Force one version everywhere.
  '@types/express': '^5.0.1'
  # next pins its own exact postcss version as a dependency (separate from
  # the patched one Tailwind/Vite already use) — force it to a patched
  # version too. postcss 8.x is backward-compatible within the major.
  postcss: '^8.5.18'
  # next also bundles an old sharp (image optimization) — force the patched line.
  sharp: '^0.35.0'
  # @firebase/firestore (even its latest release) pins @grpc/grpc-js ~1.9.0,
  # and no patched 1.9.x exists for GHSA-m9gg-hp2v-232j. Scoped to that one
  # parent so nothing else is affected; same major, used only by Firestore's
  # Node build (the browser uses WebChannel). Remove once Firebase ships a
  # release that allows grpc-js >=1.13.6.
  '@firebase/firestore>@grpc/grpc-js': '^1.14.5'
  # Pins the patched Vite 7 release for GHSA-587h-7wmj-h5pm (vite <=7.3.6;
  # test tooling only, via vitest and @vitejs/plugin-react). Review this
  # override during the next dependency update.
  vite: 7.3.7
  # GHSA-27r3-jxmh-p828 (body-parser DoS: a compressed body with trailing bytes
  # crashes the process). Fixed in 1.20.9 and 2.4.0, both inside the ranges
  # express 4 (~1.20.5, via firebase-functions) and express 5 (^2.2.1) already
  # allow; `pnpm update` would also have moved unrelated packages. Each entry
  # matches one major only, so express 4 keeps body-parser 1.x. Remove once
  # both express lines resolve the patched versions on their own.
  'body-parser@>=1.0.0 <1.20.9': '^1.20.9'
  'body-parser@>=2.0.0 <2.4.0': '^2.4.0'

auditConfig:
  ignoreGhsas:
    # braces <=3.0.3 — no patched version exists (firstPatchedVersion: null).
    # Reached only via eslint-config-next > @next/eslint-plugin-next >
    # fast-glob@3.3.1 (pinned) > micromatch > braces: lint-time only, never
    # shipped. Remove this entry as soon as braces >=3.0.4 or a fast-glob /
    # eslint-config-next release without it is published. See README § Security.
    - GHSA-vfj7-8cjw-p6xm

allowBuilds:
  '@firebase/util': true
  esbuild: true
  lefthook: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
